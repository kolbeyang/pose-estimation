[project]
name = "pose-optimizer"
version = "0.1.0"
description = "Unified pose optimizer combining MediaPipe and MotionBert pipelines"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.0,<2.6",
    "numpy>=1.24",
    "opencv-python>=4.8",
    "matplotlib>=3.7",
    "scipy>=1.11",
    "tqdm>=4.65",
    "pydantic>=2.0",
    "mediapipe>=0.10",
    "ultralytics>=8.0",
    "easydict>=1.10",
    "pytest>=7.0",
    "pytorch-stacked-hourglass>=0.5",
]

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.pytest.ini_options]
testpaths = ["experiment"]
