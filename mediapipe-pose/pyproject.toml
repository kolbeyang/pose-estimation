[project]
name = "mediapipe-pose"
version = "0.2.0"
description = "Full-body FK pose optimisation with MediaPipe Lite on CMU Panoptic"
requires-python = ">=3.12"
dependencies = [
    "opencv-python",
    "torch",
    "numpy",
    "matplotlib",
    "mediapipe",
    "scipy",
    "tqdm",
]

[tool.setuptools]
py-modules = ["main"]
