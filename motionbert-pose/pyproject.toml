[project]
name = "motionbert-pose"
version = "1.0.0"
description = "MotionBERT 3D pose estimation on CMU Panoptic"
requires-python = ">=3.12"
dependencies = [
    "opencv-python",
    "torch",
    "torchvision",
    "numpy",
    "matplotlib",
    "scipy",
    "tqdm",
    "ultralytics",
    "easydict",
    "pytorch-stacked-hourglass",
    "pydantic>=2.0",
]

[tool.setuptools]
py-modules = ["main"]
