[project]
name = "motionbert-pose"
version = "0.1.0"
description = "MotionBERT + Stacked Hourglass pose estimation with heatmap optimization"
requires-python = ">=3.12"
dependencies = [
    "opencv-python",
    "torch",
    "torchvision",
    "numpy",
    "matplotlib",
    "vpython",
    "setuptools<81",
    "ultralytics",
    "tqdm",
    "easydict",
    "scipy",
    "pytorch-stacked-hourglass",
]

[tool.setuptools]
py-modules = ["main"]
